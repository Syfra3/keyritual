<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Keyritual practice concept</title><desc id="desc">Branded terminal-style typing overlay with mode selector, target text, glyph feedback, signal stability and an unobtrusive orbital seal. Design mockup.</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#223039" stroke-width="1"/></pattern><linearGradient id="surface" x2="1" y2="1"><stop stop-color="#111d22"/><stop offset="1" stop-color="#18262a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity=".55"/></filter></defs>
  <rect width="1280" height="720" fill="#080e13"/><rect width="1280" height="720" fill="url(#grid)"/><rect x="17" y="34" width="1246" height="664" fill="none" stroke="#47615c"/><path d="M17 68h1246M17 646h1246" stroke="#47615c"/>
  <g font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace"><text x="24" y="23" fill="#779489" font-size="13">OMARCHY // SYSTEM_KEYRITUAL</text><text x="965" y="23" fill="#779489" font-size="13">PROTOCOL 02 / PRACTICE</text><text x="58" y="114" fill="#779489" font-size="15">[ 02 / FIND YOUR RHYTHM ]</text><text x="58" y="159" fill="#a7e8bc" font-size="34" font-weight="800">[KEYRITUAL] <tspan fill="#d7e2d5" font-size="19">// THE DAILY PRACTICE</tspan></text></g>
  <rect x="58" y="198" width="1164" height="405" rx="7" fill="url(#surface)" stroke="#47615c" stroke-width="2" filter="url(#shadow)"/>
  <g fill="none" stroke="#a7e8bc" stroke-width="3"><path d="M75 228v-16h16M1205 228v-16h-16M75 573v16h16M1205 573v16h-16"/></g>
  <g font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace"><text x="93" y="244" fill="#779489" font-size="14">&gt;_  KEYRITUAL / SESSION 0042</text><text x="1005" y="244" fill="#a7e8bc" font-size="14">FOCUS: ACTIVE</text><path d="M93 262h1092" stroke="#33494b"/>
    <rect x="93" y="280" width="167" height="36" rx="3" fill="#244535" stroke="#a7e8bc"/><text x="107" y="304" fill="#d7e2d5" font-size="15">[ TIME : 30S ]</text><text x="291" y="304" fill="#779489" font-size="15">WORDS : 25</text><text x="463" y="304" fill="#779489" font-size="15">PUNCT : OFF</text><text x="657" y="304" fill="#779489" font-size="15">NUMBERS : OFF</text><text x="1049" y="304" fill="#d7e2d5" font-size="15">EN / US</text>
    <path d="M93 342h1092" stroke="#33494b"/><text x="93" y="409" fill="#a7e8bc" font-size="30" letter-spacing="1">THE QUIET</text><rect x="314" y="374" width="28" height="44" fill="#a7e8bc"/><text x="318" y="409" fill="#080e13" font-size="30">M</text><text x="345" y="409" fill="#d7e2d5" font-size="30">OMENT</text><text x="490" y="409" fill="#779489" font-size="30">MAKES ROOM</text><text x="93" y="459" fill="#779489" font-size="30" letter-spacing="1">FOR SMALL STEPS AND STEADY PROGRESS</text>
    <path d="M93 485h1092" stroke="#33494b"/><text x="94" y="536" fill="#a7e8bc" font-size="36" font-weight="700">48</text><text x="151" y="535" fill="#779489" font-size="15">WPM</text><text x="268" y="536" fill="#d7e2d5" font-size="36" font-weight="700">97%</text><text x="358" y="535" fill="#779489" font-size="15">ACCURACY</text><text x="555" y="535" fill="#a7e8bc" font-size="17">▂▄▆▅▇</text><text x="687" y="535" fill="#779489" font-size="15">SIGNAL_STABILITY</text><text x="1064" y="535" fill="#d7e2d5" font-size="29">0:21</text>
    <text x="59" y="631" fill="#a7e8bc" font-size="14">[ BACKSPACE ]</text><text x="211" y="631" fill="#d7e2d5" font-size="14">CORRECT</text><text x="471" y="631" fill="#a7e8bc" font-size="14">[ TAB ]</text><text x="565" y="631" fill="#d7e2d5" font-size="14">RESTART</text><text x="802" y="631" fill="#a7e8bc" font-size="14">[ ESC ]</text><text x="896" y="631" fill="#d7e2d5" font-size="14">DISMISS</text><text x="58" y="680" fill="#779489" font-size="12">CONCEPT MOCKUP  •  FIRST PRINTABLE KEY STARTS THE TIMER  •  LOCAL ONLY</text>
