<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Keyritual results concept</title><desc id="desc">A terminal-style daily ritual completion screen with a luminous seal, typing metrics, pace chart and the retry command. Design mockup.</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#223039" stroke-width="1"/></pattern><linearGradient id="orbit" x2="1" y2="1"><stop stop-color="#a7e8bc"/><stop offset="1" stop-color="#edaa77"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity=".55"/></filter></defs>
  <rect width="1280" height="720" fill="#080e13"/><rect width="1280" height="720" fill="url(#grid)"/><rect x="17" y="34" width="1246" height="664" fill="none" stroke="#47615c"/><path d="M17 68h1246M17 646h1246" stroke="#47615c"/>
  <g font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace"><text x="24" y="23" fill="#779489" font-size="13">OMARCHY // SYSTEM_KEYRITUAL</text><text x="970" y="23" fill="#779489" font-size="13">PROTOCOL 03 / ASCEND</text><text x="58" y="115" fill="#779489" font-size="15">[ 03 / THE AFTERGLOW ]</text><text x="58" y="159" fill="#a7e8bc" font-size="34" font-weight="800">[KEYRITUAL] <tspan fill="#d7e2d5" font-size="19">// RITUAL COMPLETE</tspan></text></g>
  <rect x="58" y="198" width="1164" height="412" rx="7" fill="#111d22" stroke="#47615c" stroke-width="2" filter="url(#shadow)"/><path d="M75 227v-15h15M1205 227v-15h-15M75 582v14h15M1205 582v14h-15" fill="none" stroke="#a7e8bc" stroke-width="3"/>
  <g font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace"><text x="92" y="244" fill="#a7e8bc" font-size="15">&gt;_  SESSION 0042 / COMPLETE</text><text x="926" y="244" fill="#edaa77" font-size="15">✦ PERSONAL BEST</text><path d="M92 260h1094" stroke="#33494b"/>
    <text x="94" y="344" fill="#a7e8bc" font-size="72" font-weight="800">74</text><text x="188" y="342" fill="#779489" font-size="18">WPM</text><text x="337" y="344" fill="#d7e2d5" font-size="72" font-weight="800">98%</text><text x="501" y="342" fill="#779489" font-size="18">ACCURACY</text><text x="760" y="344" fill="#d7e2d5" font-size="72" font-weight="800">91%</text><text x="927" y="342" fill="#779489" font-size="18">CONSISTENCY</text>
    <path d="M92 363h1094" stroke="#33494b"/><text x="94" y="402" fill="#779489" font-size="14">PACE OVER TIME // 30S</text><path d="M94 451h713M94 512h713" stroke="#33494b" stroke-dasharray="4 6"/><polyline points="94,503 149,489 204,498 259,460 314,471 369,445 424,456 479,431 534,445 589,417 644,428 699,404 754,418 807,395" fill="none" stroke="#a7e8bc" stroke-width="3"/><text x="94" y="561" fill="#779489" font-size="14">RAW 78 WPM  /  MISSED KEYS: <tspan fill="#edaa77">R T E</tspan></text><text x="93" y="590" fill="#779489" font-size="13">30S  •  ENGLISH  •  FORGIVING</text><text x="58" y="678" fill="#779489" font-size="12">CONCEPT MOCKUP  •  SAMPLE SCORES ONLY  •  NO REAL RUN RECORDED</text>
  </g>
