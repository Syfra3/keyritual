<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Keyritual typography and colors</title><desc id="desc">Bracketed uppercase wordmark, monospace terminal phrases and the mint, chalk, ember and charcoal palette.</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#223039" stroke-width="1"/></pattern></defs><rect width="1200" height="650" fill="#080e13"/><rect width="1200" height="650" fill="url(#grid)"/><rect x="20" y="20" width="1160" height="610" fill="none" stroke="#49615c"/><text x="50" y="64" fill="#779489" font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace" font-size="16" letter-spacing="2">OMARCHY // SYSTEM_KEYRITUAL</text>
  <text x="50" y="192" fill="#a7e8bc" font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace" font-size="92" font-weight="800" letter-spacing="2">[KEYRITUAL]</text>
  <text x="61" y="241" fill="#d7e2d5" font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace" font-size="22" letter-spacing="2">[ DAILY PRACTICE AND STEADY IMPROVEMENT ]</text>
  <path d="M50 272h1100" stroke="#49615c"/><text x="50" y="322" fill="#779489" font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace" font-size="15">01 / COMMAND LINE</text><text x="50" y="387" fill="#a7e8bc" font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace" font-size="29">&gt;_  $ summon keyritual</text><text x="50" y="431" fill="#d7e2d5" font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace" font-size="26">INITIATING DAILY PRACTICE...</text><text x="50" y="493" fill="#779489" font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace" font-size="15">02 / PALETTE</text>
  <rect x="50" y="516" width="173" height="66" fill="#080e13" stroke="#49615c"/><rect x="231" y="516" width="173" height="66" fill="#111d22"/><rect x="412" y="516" width="173" height="66" fill="#223039"/><rect x="593" y="516" width="173" height="66" fill="#a7e8bc"/><rect x="774" y="516" width="173" height="66" fill="#d7e2d5"/><rect x="955" y="516" width="195" height="66" fill="#edaa77"/>
  <g fill="#779489" font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace" font-size="13"><text x="51" y="607">VOID</text><text x="231" y="607">SURFACE</text><text x="412" y="607">GRID</text><text x="593" y="607">MINT</text><text x="774" y="607">CHALK</text><text x="955" y="607">EMBER</text></g>
