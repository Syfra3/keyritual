<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Keyritual ritual key logomark</title><desc id="desc">Original vector interpretation of the provided moodboard: glowing orbital seal, six key nodes and a central tilted K keycap.</desc>
