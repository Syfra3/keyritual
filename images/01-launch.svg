<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Keyritual launch concept</title><desc id="desc">Dark terminal interface on a graph-paper grid, with a glowing key seal and the shell command to summon Keyritual. Design mockup.</desc>
  <defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#223039" stroke-width="1"/></pattern><radialGradient id="halo"><stop stop-color="#608a6f" stop-opacity=".34"/><stop offset="1" stop-color="#608a6f" stop-opacity="0"/></radialGradient><linearGradient id="orbit" x2="1" y2="1"><stop stop-color="#a7e8bc"/><stop offset="1" stop-color="#edaa77"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7"/></filter></defs>
  <rect width="1280" height="720" fill="#080e13"/><rect width="1280" height="720" fill="url(#grid)"/><rect x="17" y="34" width="1246" height="664" fill="none" stroke="#47615c"/><path d="M17 68h1246M17 646h1246" stroke="#47615c"/>
  <g font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace"><text x="24" y="23" fill="#779489" font-size="13">OMARCHY // SYSTEM_KEYRITUAL</text><text x="975" y="23" fill="#779489" font-size="13">PROTOCOL 01 / SUMMON</text><text x="55" y="113" fill="#779489" font-size="15" letter-spacing="2">[ 01 / THE INVOCATION ]</text>
    <text x="57" y="187" fill="#a7e8bc" font-size="64" font-weight="800" letter-spacing="1">[KEYRITUAL]</text><text x="60" y="225" fill="#d7e2d5" font-size="17">DAILY PRACTICE AND STEADY IMPROVEMENT</text>
    <text x="62" y="310" fill="#779489" font-size="15">SYSTEM_SIGNAL &gt;&gt; READY</text><text x="62" y="361" fill="#a7e8bc" font-size="27">&gt;_  $ summon keyritual</text><text x="62" y="398" fill="#d7e2d5" font-size="19">INITIATING DAILY PRACTICE...</text>
    <text x="62" y="491" fill="#779489" font-size="14">QUIET DESKTOP / FOCUSED INPUT / LOCAL RESULTS</text><text x="62" y="524" fill="#a7e8bc" font-size="17">[ ENTER ]  BEGIN THE RITUAL   [ ESC ]  CLOSE</text>
    <text x="54" y="680" fill="#779489" font-size="12">CONCEPT MOCKUP  •  OMARCHY QUATTRO / 4.x  •  CHOOSE YOUR OWN KEYBIND</text>
  </g>
  <path d="M34 131v-21h21M1251 131v-21h-21M34 624v21h21M1251 624v21h-21" fill="none" stroke="#a7e8bc" stroke-width="2"/>
  <circle cx="1008" cy="355" r="235" fill="url(#halo)"/><g transform="translate(1008 355)" fill="none" stroke="url(#orbit)" stroke-width="4"><circle r="148" opacity=".4" filter="url(#glow)" stroke-width="14"/><circle r="148"/><circle r="120"/><path d="M-128-74 0-148 128-74V74L0 148-128 74Z"/><path d="M-148 0h296M0-148v296" opacity=".25"/></g>
  <g fill="#0b1518" stroke="url(#orbit)" stroke-width="3"><circle cx="1008" cy="207" r="16"/><circle cx="1136" cy="281" r="16"/><circle cx="1136" cy="429" r="16"/><circle cx="1008" cy="503" r="16"/><circle cx="880" cy="429" r="16"/><circle cx="880" cy="281" r="16"/></g>
  <g transform="translate(1008 355) rotate(-22)"><path d="M-62-60H68v124H-62Z" fill="#264137" stroke="#a7e8bc" stroke-width="5"/><path d="M68-60 84-76V48L68 64Z" fill="#1e312d" stroke="#edaa77" stroke-width="3"/><path d="M-62-60-46-76H84L68-60Z" fill="#42634e" stroke="#a7e8bc" stroke-width="3"/><text x="5" y="30" text-anchor="middle" fill="#edca9c" font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace" font-size="77" font-weight="800">K</text></g>
  <rect x="56" y="565" width="1170" height="52" fill="#111d22" stroke="#47615c"/><text x="74" y="598" fill="#a7e8bc" font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace" font-size="16">$ omarchy-shell shell toggle io.github.syfra3.keyritual '{}'</text>
</svg>
