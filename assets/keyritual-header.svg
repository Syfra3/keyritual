<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 490" role="img" aria-labelledby="title desc">
  <title id="title">Keyritual header</title><desc id="desc">Terminal-style Keyritual wordmark with a mint and amber orbital key seal on a dark technical grid.</desc>
  <defs><pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#223039" stroke-width="1"/></pattern><radialGradient id="halo"><stop stop-color="#7bcf98" stop-opacity=".35"/><stop offset="1" stop-color="#7bcf98" stop-opacity="0"/></radialGradient><linearGradient id="orbit" x2="1" y2="1"><stop stop-color="#a7e8bc"/><stop offset="1" stop-color="#edaa77"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="7"/></filter></defs>
  <rect width="1600" height="490" fill="#080e13"/><rect width="1600" height="490" fill="url(#grid)"/><rect x="23" y="36" width="1554" height="418" fill="none" stroke="#49615c" stroke-width="2"/><path d="M23 76h1554M23 416h1554" stroke="#49615c"/>
  <g font-family="JetBrains Mono,IBM Plex Mono,DejaVu Sans Mono,monospace"><text x="47" y="25" fill="#779489" font-size="16">OMARCHY // SYSTEM_KEYRITUAL</text><text x="1280" y="25" fill="#779489" font-size="16">PROTOCOL / 001</text><text x="85" y="133" fill="#779489" font-size="20" letter-spacing="2">&gt;_  INITIALIZING DAILY PRACTICE</text><text x="78" y="239" fill="#a7e8bc" font-size="91" font-weight="800" letter-spacing="1">[KEYRITUAL]</text><text x="88" y="288" fill="#d7e2d5" font-size="22" letter-spacing="2">[ DAILY PRACTICE AND STEADY IMPROVEMENT ]</text><text x="86" y="358" fill="#779489" font-size="18">$ summon keyritual <tspan fill="#a7e8bc">█</tspan></text><text x="49" y="445" fill="#779489" font-size="13">[ FOCUS ]  [ RHYTHM ]  [ REFLECTION ]</text><text x="1276" y="445" fill="#779489" font-size="13">KEYRITUAL // 2026</text></g>
  <circle cx="1322" cy="245" r="178" fill="url(#halo)"/><g transform="translate(1322 245)" fill="none" stroke="url(#orbit)" stroke-width="3"><circle r="130" opacity=".45" filter="url(#glow)" stroke-width="13"/><circle r="130"/><circle r="105"/><path d="M-112-65 0-130 112-65V65L0 130-112 65Z"/><path d="M-130 0h260M0-130v260" opacity=".3"/></g>
  <g fill="#101a1c" stroke="url(#orbit)" stroke-width="3"><circle cx="1322" cy="115" r="14"/><circle cx="1434" cy="180" r="14"/><circle cx="1434" cy="310" r="14"/><circle cx="1322" cy="375" r="14"/><circle cx="1210" cy="310" r="14"/><circle cx="1210" cy="180" r="14"/></g>
